name: Pages

# main が変わったら、site/ に時刻表（data/timetable.json）を埋め込んで GitHub Pages に公開する。
#
# 事前準備: Settings → Pages の Source を「GitHub Actions」にする。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: テスト
        run: python3 -m unittest discover -s tests

      - name: 公開する一式を作る
        run: python3 scripts/build_site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
